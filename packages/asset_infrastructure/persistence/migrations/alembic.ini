[alembic]
# Ambiente Alembic PRÓPRIO da vertical Asset (A-M1 de
# docs/architecture/MIGRATION_CONCURRENCY_STRATEGY.md, Opção D -> C). Histórico,
# env.py e rastreamento de versão (`alembic_version_asset`) independentes do
# ambiente de Core+Livestock em packages/core_infrastructure/persistence/migrations.
# Invocar sempre com -c apontando para este arquivo, a partir da raiz do repo:
#   python -m uv run --locked python -m alembic -c packages/asset_infrastructure/persistence/migrations/alembic.ini <comando>
script_location = %(here)s
prepend_sys_path = .
version_path_separator = newline
version_locations =
    %(here)s/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
