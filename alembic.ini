[alembic]
script_location = %(here)s/packages/core_infrastructure/persistence/migrations
prepend_sys_path = .
# Este arquivo é o ambiente de Core+Livestock (Opção D de
# docs/architecture/MIGRATION_CONCURRENCY_STRATEGY.md). Com uma entrada,
# `version_locations` é igual ao padrão implícito `<script_location>/versions`
# — mudança de configuração, não de comportamento.
#
# Asset (A-M1) NÃO usa este arquivo: tem ambiente Alembic próprio em
# packages/asset_infrastructure/persistence/migrations/alembic.ini (env.py,
# versions/ e tabela de rastreio `alembic_version_asset` independentes) —
# Opção C plena, aplicada desde o dia 1 porque Asset nasce depois da decisão.
# Invocar com:
#   alembic upgrade heads                                                    # Core+Livestock
#   alembic -c packages/asset_infrastructure/persistence/migrations/alembic.ini upgrade heads  # Asset
version_path_separator = newline
version_locations =
    %(here)s/packages/core_infrastructure/persistence/migrations/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
