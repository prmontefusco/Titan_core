[alembic]
script_location = %(here)s/packages/core_infrastructure/persistence/migrations
prepend_sys_path = .
# Uma entrada por dono de migration. Hoje só a do Core+Livestock (Opção D de
# docs/architecture/MIGRATION_CONCURRENCY_STRATEGY.md); a de Asset é acrescentada
# em A-M1. Com uma entrada, `version_locations` é igual ao padrão implícito
# `<script_location>/versions` — mudança de configuração, não de comportamento.
version_path_separator = newline
version_locations =
    %(here)s/packages/core_infrastructure/persistence/migrations/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
